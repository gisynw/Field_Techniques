<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Point Web Map with Clustering</title>

  <!-- ArcGIS Maps SDK for JavaScript (4.30) -->
  <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.30/"></script>

  <style>
    html, body, #viewDiv {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }
    /* Nice, compact panels */
    .panel {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="viewDiv"></div>

  <script>
    require([
      "esri/WebMap",
      "esri/views/MapView",
      "esri/widgets/Search",
      "esri/widgets/Legend",
      "esri/widgets/LayerList",
      "esri/widgets/BasemapToggle",
      "esri/widgets/Home",
      "esri/widgets/Fullscreen",
      "esri/widgets/Expand"
    ], function(
      WebMap,
      MapView,
      Search,
      Legend,
      LayerList,
      BasemapToggle,
      Home,
      Fullscreen,
      Expand
    ) {

      // 1) Load your WebMap by Item ID
      const webmap = new WebMap({
        portalItem: { id: "" } // <- your map ID
      });

      // 2) Create a 2D view
      const view = new MapView({
        container: "viewDiv",
        map: webmap
      });

      // 3) Enable clustering for all point FeatureLayers in the WebMap
  view.when(() => {
  const applyClustering = (layer) => {
    layer.when(() => {
      if (layer.type === "feature" && layer.geometryType === "point") {
        layer.featureReduction = {
          type: "cluster",
          clusterRadius: "30px",
           renderer: {
    type: "simple",
    symbol: {
      type: "simple-marker",
      style: "circle",
      color: "#1f78b4",   // 🔹 Fill color (blue in this example)
      size: "24px",
      outline: {
        color: "white",
        width: 1.5
      }
    }
  }
        };
      }
    });
  };

  // existing layers (including inside group layers)
  webmap.allLayers.forEach(applyClustering);

  // if layers are added later (e.g., from the web map loading in stages)
  webmap.allLayers.on("change", (evt) => {
    evt.added?.forEach(applyClustering);
  });
});
      // 4) UI widgets
      const search = new Search({ view });
      view.ui.add(search, "top-right");

      const legend = new Legend({ view });
      const legendExpand = new Expand({
        view,
        content: legend,
        expandTooltip: "Legend",
        mode: "floating"
      });
      view.ui.add(legendExpand, "top-left");

      const layerList = new LayerList({ view });
      const layerListExpand = new Expand({
        view,
        content: layerList,
        expandTooltip: "Layers",
        mode: "floating"
      });
      view.ui.add(layerListExpand, "top-left");

      const basemapToggle = new BasemapToggle({
        view,
        nextBasemap: "hybrid"
      });
      view.ui.add(basemapToggle, "bottom-right");

      const home = new Home({ view });
      view.ui.add(home, "top-left");

      const fullscreen = new Fullscreen({ view });
      view.ui.add(fullscreen, "top-right");

      // 5) Optional: improve initial viewpoint once the map loads
      view.when(() => {
        if (!view.extent) return;
        view.goTo({ target: view.extent.expand(1.05) }, { duration: 500 });
      });
    });
  </script>
</body>
</html>
